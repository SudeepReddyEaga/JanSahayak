# ==============================================================================
# Nginx Configuration for Frontend UI Container (Port 3000)
# Serves SPA assets and forwards /api/* & /health requests to api-gateway:8000
# ==============================================================================
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve SPA static files cleanly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve /static/* paths equivalently when accessed via port 3000
    location /static/ {
        alias /usr/share/nginx/html/;
    }

    # Reverse-proxy API requests (including SSE streaming) to API Gateway microservice
    location /api/ {
        proxy_pass http://api-gateway:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api-gateway:8000/health;
    }
}

